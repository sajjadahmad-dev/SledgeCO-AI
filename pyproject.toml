[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "sledgeco-ai"
version = "0.1.0"
description = "AI-powered Change Order document extraction pipeline for construction industry"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sajjad Ahmad" }
]

dependencies = [
    "anthropic>=0.40.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "rapidfuzz>=3.9.0",
    "chardet>=5.2.0",
    "reportlab>=4.2.0",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.13",
]

api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]
streamlit = [
    "streamlit>=1.39.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
sledge = "app.cli:main"

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pymupdf.*",
    "pytesseract.*",
    "streamlit.*",
    "sklearn.*",
    "rapidfuzz.*",
    "chardet.*",
    "reportlab.*",
]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
